name: Instruction file size

# Claude Code warns past 40,000 characters per instruction file, and adherence drops.
on:
  pull_request:
    paths: ['**/CLAUDE.md', '**/CLAUDE.local.md', '.claude/rules/**']
  push:
    branches: [main]
    paths: ['**/CLAUDE.md', '**/CLAUDE.local.md', '.claude/rules/**']

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep every instruction file under 40,000 characters
        env:
          # wc -m counts bytes in the C locale; the limit is in characters.
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            chars=$(wc -m < "$file")
            if [ "$chars" -ge 40000 ]; then
              echo "::error file=$file::$chars characters; split it by path into .claude/rules/ (limit 40,000)"
              status=1
            fi
          done < <(find . -path ./node_modules -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -path './.claude/rules/*.md' \) -type f -print0)
          exit "$status"
